# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # # Triggers the workflow on push or pull request events but only for the "main" branch
  # workflow_dispatch: # allows manual triggering
  # push:
  #   branches: [ "main" ]
  # pull_request:
  #   branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      ref:
        description: 'media3 branch or tag'
        default: 'release'
        required: true
        type: string

permissions:
  contents: write

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout Media3
        uses: actions/checkout@v4
        with:
          repository: MSOB7YY/media
          ref: ${{ inputs.ref }}
          path: media
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
  
      - uses: ilammy/setup-nasm@v1
      - name: Install Meson
        run: pip3 install --user meson
      
   
      # Set up NDK
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
          local-cache: false
          add-to-path: true
      # Build 
      - name: Build
        continue-on-error: false
        env:
          ANDROID_NDK_HOME: ${{steps.setup-ndk.outputs.ndk-path }}
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
          ROOT_DIR:  ${{ github.workspace }}
        run: |
         echo "build ffmpeg"
         source ${{ github.workspace }}/.github/scripts/build.sh
         
         echo "Build Success"
        



      # Runs a set of commands using the runners shell
      - name: Upload FFmpeg Static Libs
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: "ffmpeg"
          path: ${{ github.workspace }}/media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg/android-libs

      - name: Upload library
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: aar-library
          path: repo


      - name: Resolve release tag
        id: tag
        run: |
          tag="${{ inputs.ref }}"
          existing="$(git ls-remote --tags origin | sed 's#.*refs/tags/##')"
          while grep -qxF "$tag" <<< "$existing"; do
            if [[ "$tag" =~ ^(.*[^0-9])([0-9]+)$ ]]; then
              tag="${BASH_REMATCH[1]}$(( BASH_REMATCH[2] + 1 ))"
            else
              tag="${tag}2"
            fi
          done
          git tag "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Push
        uses: ad-m/github-push-action@master
        with:
          force: true
          tags: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: 'repo'

      - name: Zip release assets
        run: |
          (cd media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg && zip -qr "$GITHUB_WORKSPACE/ffmpeg-android-libs.zip" android-libs)
          zip -qr aar-repo.zip repo

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body: "media3 ref: `${{ inputs.ref }}`"
          files: |
            ffmpeg-android-libs.zip
            aar-repo.zip

        

       
